name: Build and publish ARM64 image

on:
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: s3-consumer-image-${{ github.ref }}
    cancel-in-progress: true

env:
    IMAGE_NAME: ghcr.io/iterating-io/s3-consumer.iterating.io/consumer

jobs:
    build-and-publish:
        runs-on: ubuntu-24.04-arm
        steps:
            - name: Check out source
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha,format=short,prefix=

            - name: Build and push ARM64 image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./dockerfile.consumer
                  platforms: linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

            - name: Report published image
              run: echo "Published ${{ steps.meta.outputs.tags }} for linux/arm64"
